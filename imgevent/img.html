<html>
<head>
<title></title>
<style>
        body {
            text-align: center;
            font-family: Arial, sans-serif;
            margin-top: 50px;
        }

        img {
            width: 150px;
            height: 150px;
            border-radius: 50%;
            border: 3px solid blue;
            object-fit: cover;
        }

        p {
            font-size: 20px;
            font-weight: bold;
        }
</style>
</head>
<body>
	<img src="a.jpeg" id="image" onmouseover="one()"
     onmouseout="two()">
     <p id="p1">
<script>
function one()
{
    document.getElementById("image").src = "b.jpeg";
    document.getElementById("p1").innerHTML = "onmouseover";
    document.getElementById("p1").style.color="blue";
}

function two()
{
    document.getElementById("image").src = "c.jpeg";
    document.getElementById("p1").innerHTML = "onmouseout";
    document.getElementById("p1").style.color="red";
}
</script>
</body>
</html>
