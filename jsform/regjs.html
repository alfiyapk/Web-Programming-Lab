<html>
<head>
<title>
</title>
</head>
<body>
	<h1><center>FORM VALIDATION</center></h1>
<form name="form" action="" onsubmit="return validateform()">
		<label>Name:</label>
		<select name="init" id="init">
			<option value="Mr">Mr</option>
			<option value="Miss">Miss</option>
			<option value="Mrs">Mrs</option>
		</select>			
		<input type="text" id="fname" name="fname" placeholder="enter your name"><br><br>
		<label>Phone:</label>
		<select name="code" id="code" >
			<option value="+91">+91</option>
			<option value="+62">+62</option>
			<option value="+93">+93</option>
			<option value="+92">+92</option>
		</select>
		<input type="tel" name="mob" id="phone" placeholder="enter mobile number" ></label>
		<br><br>
		<label>Email:</label>
		<input type="email" name="email" id="email" placeholder="enter email">
		<br><br>
	<button type="submit">Submit</button>
</form>
<script>
function validateform()
{
	var fname=document.form.fname.value.trim();
	var mob=document.form.mob.value.trim();
	var email=document.form.email.value.trim();
	if(fname=="")
	{
		alert("Enter your name");
		document.fname.focus();
		return false;
	}
	else if(!/^[a-zA-Z]+$/.test(fname))
	{
		alert("Enter valid name");
		document.form.fname.focus();
		return false;
	}
	if(mob=="")
	{
		alert("Enter mobile Number");
		document.form.mob.focus();
		return false;
	}
	else if(!/^[0-9]{10}$/.test(mob))
	{
		alert("Enter valid mobile number");
		document.form.mob.focus();
		return false;
	}
	if(email=="")
	{
		alert("Enter Email");
		document.form.email.focus();
		return false;
	}
	else if(!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email))
	{
		alert("Enter valid email");
		document.form.email.focus();
		return false;
	}
	alert("form Submitted Successfully");
	return true;
}
</script>
</body>
</html>
